<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AxiomIP | 矩阵后台管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

  <!-- 🔒 密码登录锁屏界面 (初始密码: password) -->
  <div id="loginLock" class="fixed inset-0 bg-gray-950 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-800 w-full max-w-sm rounded-2xl p-8 shadow-2xl">
      <div class="text-center mb-6">
        <div class="inline-flex p-3 rounded-2xl bg-orange-500/10 text-orange-500 text-2xl mb-3">🔐</div>
        <h2 class="text-xl font-bold text-white">管理控制台鉴权</h2>
        <p class="text-xs text-gray-400 mt-1">请输入后台管理密码进入配置中心</p>
      </div>
      <div class="space-y-4">
        <input id="pwdInput" type="password" placeholder="初始默认密码: password" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500 text-center font-mono">
        <button onclick="verifyLogin()" class="w-full py-3 bg-orange-600 hover:bg-orange-500 rounded-xl font-bold text-sm text-white transition">
          解锁并进入后台
        </button>
      </div>
    </div>
  </div>

  <!-- 主后台操作界面 -->
  <div id="mainAdmin" class="hidden max-w-6xl mx-auto p-6">
    <!-- 头部 -->
    <div class="flex items-center justify-between border-b border-gray-800 pb-4 mb-6">
      <div>
        <h1 class="text-2xl font-black text-white flex items-center gap-2">
          ⚡ Axiom<span class="text-orange-500">IP</span> 业务参数中心
        </h1>
        <p class="text-xs text-gray-400 mt-1">支持 30 个 IP 节点价格批量管理与动态发布</p>
      </div>
      <div class="flex gap-3">
        <button onclick="changeAdminPassword()" class="px-4 py-2 bg-gray-900 hover:bg-gray-800 border border-gray-700 rounded-xl text-xs font-bold text-gray-300">
          🔑 修改登录密码
        </button>
        <button onclick="saveAndDeploy()" id="saveBtn" class="px-5 py-2.5 bg-orange-600 hover:bg-orange-500 rounded-xl font-bold text-sm text-white transition flex items-center gap-2 shadow-lg shadow-orange-600/30">
          🚀 保存并全网发布
        </button>
      </div>
    </div>

    <!-- GitHub 凭证 -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 mb-6">
      <h2 class="text-xs font-bold text-orange-400 uppercase tracking-wider mb-3">⚙️ GitHub 自动同步凭证</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">GitHub 用户名</label>
          <input id="ghUser" type="text" value="sonytxl" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs text-white">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">仓库名</label>
          <input id="ghRepo" type="text" value="global-proxy-web" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs text-white">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">GitHub Token</label>
          <input id="ghToken" type="password" placeholder="ghp_xxx" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs text-white font-mono">
        </div>
      </div>
    </div>

    <!-- 30 个 IP 节点配置矩阵 -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 mb-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xs font-bold text-orange-400 uppercase tracking-wider">📦 30 个全球节点参数表 (5列 × 6排)</h2>
        <span class="text-xs text-gray-500 font-mono">Total: 30 Locations</span>
      </div>
      
      <div id="adminIpGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-h-[600px] overflow-y-auto p-1">
        <!-- 渲染 30 个编辑卡片 -->
      </div>
    </div>
  </div>

  <script>
    let siteConfig = null;

    window.onload = async () => {
      document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
      try {
        const res = await fetch('./config.json?' + Date.now());
        siteConfig = await res.json();
      } catch (e) {
        alert('无法拉取 config.json，请检查仓库文件！');
      }
    };

    function verifyLogin() {
      const pwd = document.getElementById('pwdInput').value.trim();
      const truePwd = (siteConfig && siteConfig.adminPassword) ? siteConfig.adminPassword : 'password';

      if (pwd === truePwd) {
        document.getElementById('loginLock').classList.add('hidden');
        document.getElementById('mainAdmin').classList.remove('hidden');
        renderAdminIpGrid();
      } else {
        alert('密码错误！默认密码为: password');
      }
    }

    function changeAdminPassword() {
      const newPwd = prompt('请输入新的后台登录密码:', '');
      if (newPwd && newPwd.trim().length >= 4) {
        siteConfig.adminPassword = newPwd.trim();
        alert('密码已在内存中修改！请点击右上角【🚀 保存并全网发布】以永久保存至 GitHub。');
      } else if (newPwd !== null) {
        alert('密码长度至少为 4 位！');
      }
    }

    function renderAdminIpGrid() {
      const container = document.getElementById('adminIpGrid');
      container.innerHTML = '';

      siteConfig.ipNodes.forEach((node, idx) => {
        const card = document.createElement('div');
        card.className = "bg-gray-950 border border-gray-800 rounded-xl p-3.5 space-y-2";
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-xs text-white">${node.id}. ${node.flag} ${node.name_zh} (${node.name_en})</span>
            <span class="text-[10px] font-mono uppercase text-gray-500">${node.continent}</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-gray-500">地区名 (中)</label>
              <input id="node_region_zh_${idx}" type="text" value="${node.region_zh}" class="w-full bg-gray-900 border border-gray-800 rounded p-1 text-xs text-white">
            </div>
            <div>
              <label class="block text-[10px] text-gray-500">Region (EN)</label>
              <input id="node_region_en_${idx}" type="text" value="${node.region_en}" class="w-full bg-gray-900 border border-gray-800 rounded p-1 text-xs text-white">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-gray-500">人民币价格 (元/月)</label>
              <input id="node_price_cny_${idx}" type="number" value="${node.price_cny}" class="w-full bg-gray-900 border border-gray-800 rounded p-1 text-xs text-orange-400 font-mono">
            </div>
            <div>
              <label class="block text-[10px] text-gray-500">美元价格 ($/mo)</label>
              <input id="node_price_usd_${idx}" type="number" value="${node.price_usd}" class="w-full bg-gray-900 border border-gray-800 rounded p-1 text-xs text-orange-400 font-mono">
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function saveAndDeploy() {
      const token = document.getElementById('ghToken').value.trim();
      const user = document.getElementById('ghUser').value.trim();
      const repo = document.getElementById('ghRepo').value.trim();

      if (!token) {
        alert('请在上方输入 GitHub Token！');
        return;
      }
      localStorage.setItem('gh_token', token);

      // 读取 30 个节点的最新输入值
      siteConfig.ipNodes.forEach((node, idx) => {
        node.region_zh = document.getElementById(`node_region_zh_${idx}`).value;
        node.region_en = document.getElementById(`node_region_en_${idx}`).value;
        node.price_cny = parseFloat(document.getElementById(`node_price_cny_${idx}`).value) || 0;
        node.price_usd = parseFloat(document.getElementById(`node_price_usd_${idx}`).value) || 0;
      });

      const btn = document.getElementById('saveBtn');
      btn.innerText = '正在发布到 GitHub...';
      btn.disabled = true;

      try {
        const getRes = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/config.json`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const fileData = await getRes.json();

        const updateRes = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/config.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            message: 'chore: update 30 IP nodes pricing and admin config',
            content: btoa(unescape(encodeURIComponent(JSON.stringify(siteConfig, null, 2)))),
            sha: fileData.sha
          })
        });

        if (updateRes.ok) {
          alert('🎉 保存并发布成功！10 秒后刷新前台即可看到最新的 IP 价格与矩阵数据！');
        } else {
          alert('保存失败，请检查 GitHub Token 权限！');
        }
      } catch (e) {
        alert('请求出错: ' + e.message);
      } finally {
        btn.innerText = '🚀 保存并全网发布';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
